controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    - start_goal_checker
    - inspection_route_goal_checker
    controller_plugins:
    - FollowPath
    - InspectionStrict
    current_controller: FollowPath
    current_goal_checker: goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 40.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.14
      stateful: true
    start_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 50
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.2
      vx_max: 0.3
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.65
      ax_max: 0.4
      ax_min: -0.4
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.8
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      transform_tolerance: 0.5
      prune_distance: 1.5
      TrajectoryVisualizer:
        trajectory_step: 8
        time_step: 4
      critics:
      - ConstraintCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.7
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.7
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.35
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 8
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5
    InspectionStrict:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 50
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.12
      vx_max: 0.2
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.45
      ax_max: 0.35
      ax_min: -0.35
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.65
      temperature: 0.2
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      transform_tolerance: 0.5
      prune_distance: 1.5
      critics:
      - ConstraintCritic
      - GoalCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.7
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        max_path_occupancy_ratio: 1.0
        trajectory_point_step: 1
        threshold_to_consider: 0.0
        offset_from_furthest: 8
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 40.0
        offset_from_furthest: 5
        threshold_to_consider: 0.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 0.0
        max_angle_to_furthest: 1.0
        mode: 0
    inspection_route_goal_checker:
      plugin: inspection_geometry_tools::OrderedRouteGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.14
      stateful: true
      route_progress_tolerance: 0.35
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.3
    - 0.0
    - 0.45
    min_velocity:
    - 0.0
    - 0.0
    - -0.45
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    max_accel:
    - 0.45
    - 0.0
    - 0.8
    max_decel:
    - -0.45
    - 0.0
    - -0.8
    odom_topic: /odom
    odom_duration: 0.1
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[[0.450,0.355],[0.450,-0.355],[-0.450,-0.355],[-0.450,0.355]]'
      footprint_padding: 0.03
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.05
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 2.5
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      footprint: '[[0.450,0.355],[0.450,-0.355],[-0.450,-0.355],[-0.450,0.355]]'
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          obstacle_max_range: 10.0
          obstacle_min_range: 0.05
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 2.0
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: false
      allow_unknown: false
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: false
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
